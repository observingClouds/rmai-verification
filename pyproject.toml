[project]
name = "rmai-verification"
version = "0.1.0"
description = "Toolbox to load, align and compare meteorological forecasts and observations in different formats."
authors = [
    {name = "Michiel Van Ginderachter",email = "michiel.vanginderachter@meteo.be"},
    {name = "Dieter Van den Bleeken"}
]
readme = "README.md"
requires-python = ">3.10"

dependencies = [
    "xarray (>=2024.10)",
    "Cartopy (>=0.23)",
    "zarr (>=2.16)",
    "pandas (>=2.2)",
    "xskillscore (>=0.0.24)",
    "PyYAML (>=6.0.0)",
    "matplotlib (>= 3.9.0)",
    "dask (>=2024.0)"
]

[project.optional-dependencies]
cluster = ["dask-jobqueue (>=0.8)"]
dev = [
    "dask-jobqueue (>=0.8)", 
    "poetry (>=2.0)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
