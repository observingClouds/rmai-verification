dates:
      start: 2020-01-01 12:00:00
      end: 2020-01-31 12:00:00
      frequency: 24h

variables: [z_500, 2t, 10u, 10v, 2d, t_500]


forecasts:
  anemoi_v0:
    type: anemoi-inference
    path: /scratch/project_465001235/vandenbl/anemoi/experiments/inference/first_full_year/outputs/{yyyy}{mm}{dd}{HH}.nc
    reshape: False # No reshaping necessary since we want to calculates timeseries
    reference_time: False
    correct_coords: False
    nx: 1069
    ny: 1069
    grid_mapping: null
    dataset_attrs:
      thinning: 1

observations:
  CERRA: 
    type: anemoi-datasets
    path: /scratch/project_465001235/datasets/cerra-rr-an-oper-0001-mars-5p5km-1984-2020-3h-v2-rmi.zarr
    rename_dict: 
        2t_2: 2t
        2d_2: 2d
        10u_10: 10u
        10v_10: 10v
        msl_0: msl
        tciwv_0: ticwv
    # grid_mapping: 
    #   projection: lcc
    #   projection_kws:
    #     globe:
    #       semimajor_axis: 6371229.0
    #       semiminor_axis: 6371229.0
    #     central_longitude: 8.0
    #     central_latitude: 50.0
    #     standard_parallels: [50.0, 50.0]
    #   grid:
    #     delta_x : 5500.0
    #     delta_y : 5500.0

verification:
  type: temporal
  reference_model: cerra
  variables: [z_500, 2t, 10u, 10v, 2d, t_500]
  metrics:
    - RMSE
    - BIAS

visualization:
   variables: [z_500, 2t, 10u, 10v, 2d, t_500]
   metrics: all
   confidence_intervals: False
   cols_per_page: 3
   rows_per_page: 2


output:
  path: verif_jan2020.nc
  type: netcdf