forecasts:
  anemoi_v0:
    type: anemoi-inference
    dates:
      start: 2007-11-05 00:00:00
      end: 2007-11-07 00:00:00
      frequency: 24h
    path: /scratch/project_465001235/vandenbl/anemoi/experiments/inference/lam_real_test/fc_init_{yyyy}{mm}{dd}_{HH}.nc
    nx: 268
    ny: 268
    grid_mapping: cerra
    dataset_attrs:
      thinning: 4

observations:
  CERRA: 
    type: anemoi-datasets
    path: /scratch/project_465001235/datasets/cerra-rr-an-oper-0001-mars-5p5km-1984-2020-3h-v2-rmi.zarr
    thinning: 4
    grid_mapping:
      projection: lcc
      projection_kws:
        globe:
          semimajor_axis: 6371229.0
          semiminor_axis: 6371229.0
        central_longitude: 8.0
        central_latitude: 50.0
        standard_parallels: [50.0, 50.0]
      grid:
        delta_x : 5500.0
        delta_y : 5500.0

verification:
  type: spatial
  reference_model: cerra
  variables: all
  metrics:
    - RMSE
    - BIAS

# visualization:
