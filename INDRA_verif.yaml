  #     - ALO4
  #     - ECDET
  #   rename_dict: 
  #     station: location
  #     T2M: 2t
  #     S10M: 10s
    
observations:
  CERRA: 
    type: anemoi-datasets
    path: /scratch/project_465001235/datasets/cerra-rr-an-oper-0001-mars-5p5km-1984-2020-3h-v2-rmi.zarr
    rename_dict: 
        2t_2: 2t
        2d_2: 2d
        10u_10: 10u
        10v_10: 10v
        msl_0: msl
        tciwv_0: ticwv
  # SYNOP:
  #   type: rmi-re-pytools-obs
  #   path: /scratch/project_465001235/datasets/INDRA_2020_v2.nc
  #   model: OBS
  #   rename_dict: 
  #     station: location
  #     T2M: 2t
  #     S10M: 10s

post_processing:
  - data:
      - anemoi_v0
      - CERRA
    interpolation:
        grid: cerra
        locations: INDRA.yaml
    # uv-to-s:
    #   levels: 10
    #   drop_uv: True
  # - data:
  #     - INDRA
  #     - SYNOP
  #   t-C-to-K:
  #     levels: 2




verification:
  type: temporal
  reference_model: cerra
  variables: [2t, 10u, 10v]
  metrics:
    - RMSE
    - BIAS

visualization:
   variables: [2t, 10u, 10v]
   metrics: all
   confidence_intervals: False
   cols_per_page: 3
   rows_per_page: 2


output:
  path: verif_INDRA_jan2020.nc
  type: netcdf